# Dùng cho local dev: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keepay
      POSTGRES_PASSWORD: keepay
      POSTGRES_DB: keepay
    ports:
      - '5432:5432'
    volumes:
      - keepay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keepay']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keepay_pg_data:
